name: Publish

# Publishes to npm via OIDC trusted publishing: no NPM_TOKEN, no long-lived secret.
# Provenance attestations are generated automatically for public repos.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Show package identity
        run: |
          node -p "'name=' + require('./package.json').name"
          node -p "'version=' + require('./package.json').version"
          node -p "'repository=' + require('./package.json').repository.url"
          node -v
          npm -v

      - name: Publish
        run: npm publish
